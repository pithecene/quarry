name: 🤖 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  version-lockstep:
    name: 🔒 Version Lockstep
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔒 Check Version Lockstep
        run: scripts/version-check.sh

  cli-parity:
    name: 📋 CLI Parity
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📋 Check CLI Parity
        run: scripts/ci/cli-parity.sh

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Lint
        run: task lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Test
        run: task test:race

  oldest-node:
    name: 🕰️ Oldest Node
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Test on the oldest Node
        run: task go:test:oldest-node

  bundle-freshness:
    name: 📦 Bundle Freshness
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Regenerate bundle
        run: task executor:bundle

      - name: 🔍 Check for drift
        run: scripts/ci/bundle-fresh.sh

  sdk-lockstep:
    name: 🔒 SDK Build Lockstep
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build SDK
        run: pnpm -C sdk run build

      - name: 🔍 Verify CONTRACT_VERSION matches source
        run: scripts/ci/sdk-lockstep.sh

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build
        run: task build

  examples:
    name: 📦 Examples
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Run Examples
        run: task examples
        env:
          QUARRY_NO_SANDBOX: "1"

      - name: ⬆️ Upload Example Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-run-logs
          path: .example-runs/
          retention-days: 14

  container:
    name: 🐳 Dockerfile Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Validate Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          call: check

      - name: 🐳 Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          load: true
          tags: quarry:ci

      - name: 🧪 Run as an Unmapped UID
        run: scripts/ci/container-smoke.sh quarry:ci
