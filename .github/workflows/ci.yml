name: 🤖 CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  version-lockstep:
    name: 🔒 Version Lockstep
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔒 Check Version Lockstep
        run: scripts/version-check.sh

  cli-parity:
    name: 📋 CLI Parity
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📋 Check CLI Parity
        run: |
          cd quarry
          # Guard: ensure at least one parity test exists (prevents false-pass)
          PARITY_TESTS=$(go test ./cli/cmd -list 'TestCLIParity' 2>/dev/null | grep -c 'TestCLIParity' || true)
          if [ "$PARITY_TESTS" -eq 0 ]; then
            echo "::error::No TestCLIParity* tests found - strict parity gate requires at least one"
            exit 1
          fi
          echo "Found $PARITY_TESTS parity tests"
          go test ./cli/cmd -run Parity -v
          echo "✅ CLI parity artifact is in sync"

  check:
    name: 🧾 Internal Check
    # The release check is private to the maintainers. A pull request that a
    # fork or Dependabot opens creates no job, rather than a job that fails
    # for want of access to the check.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # The Go analysis downloads and compiles the module's dependencies,
      # which this cache keeps between runs, at a path relative to the
      # workspace so that the cache's version stays the same across runners.
      - name: 📦 Go Cache
        uses: actions/cache@v4
        with:
          path: .bosun/go
          key: bosun-go-${{ runner.os }}-${{ hashFiles('quarry/go.sum', 'mise.toml') }}
          restore-keys: bosun-go-${{ runner.os }}-

      # The check runs as bosun.yaml configures it, in the image that
      # BOSUN_IMAGE in mise.toml pins by version and digest: the changelog
      # check and Bosun's Go analyzers on the quarry module.
      - name: 🧾 Check
        # A read-only registry token pulls the private image.
        env:
          REGISTRY_USER: ${{ secrets.BOSUN_REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.BOSUN_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          image="$(sed -n 's/^BOSUN_IMAGE = "\(.*\)"$/\1/p' mise.toml)"
          [ -n "$image" ] || { echo "mise.toml pins no BOSUN_IMAGE" >&2; exit 1; }
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$REGISTRY_USER" --password-stdin
          mkdir -p .bosun/go
          docker run --rm -v "$GITHUB_WORKSPACE:/work" -e GITHUB_ACTIONS -e GITHUB_ACTOR \
            -e GOMODCACHE=/work/.bosun/go/mod -e GOCACHE=/work/.bosun/go/build \
            -e GOLANGCI_LINT_CACHE=/work/.bosun/go/lint "$image" check

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🧹 Lint
        run: task lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🧪 Test
        run: task test

  bundle-freshness:
    name: 📦 Bundle Freshness
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 📦 Regenerate bundle
        run: task executor:bundle

      - name: 🔍 Check for drift
        run: |
          if ! git diff --exit-code quarry/executor/bundle/executor.mjs; then
            echo "::error::Embedded executor bundle is stale. Run 'task executor:bundle' and commit the result."
            exit 1
          fi
          echo "✅ Bundle is fresh"

  sdk-lockstep:
    name: 🔒 SDK Build Lockstep
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗️ Build SDK
        run: pnpm -C sdk run build

      - name: 🔍 Verify CONTRACT_VERSION matches source
        run: |
          SOURCE_VERSION=$(grep -oP "export const CONTRACT_VERSION = '\K[^']+" sdk/src/types/events.ts)
          BUILT_VERSION=$(grep -oP 'const CONTRACT_VERSION = "\K[^"]+' sdk/dist/index.mjs)
          echo "Source CONTRACT_VERSION: $SOURCE_VERSION"
          echo "Built CONTRACT_VERSION:  $BUILT_VERSION"
          if [ "$SOURCE_VERSION" != "$BUILT_VERSION" ]; then
            echo "::error::SDK build CONTRACT_VERSION mismatch!" \
              "Source ($SOURCE_VERSION) != Built ($BUILT_VERSION)"
            exit 1
          fi
          echo "✅ SDK build lockstep verified"

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗️ Build
        run: task build

  examples:
    name: 📦 Examples
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: jdx/mise-action@v2

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 📦 Run Examples
        run: task examples
        env:
          QUARRY_NO_SANDBOX: "1"

      - name: ⬆️ Upload Example Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-run-logs
          path: .example-runs/
          retention-days: 14

  container:
    name: 🐳 Dockerfile Check
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Validate Dockerfile
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          call: check
