name: 🔬 Release Dry Run

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to simulate (e.g., v0.1.0)
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate_version:
    name: 🔎 Validate Version
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: 🔎 Releases Are Monotonic
        env:
          VERSION: ${{ inputs.version }}
        run: node scripts/release/src/cli.ts assert-highest-tag "$VERSION"

  version_lockstep:
    name: 🔒 Version Lockstep
    runs-on: ubuntu-latest
    needs: [validate_version]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔒 Check All Versions Match Input
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/version-check.sh "$VERSION"

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    needs: [validate_version]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🧹 Lint
        run: task lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: [validate_version]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🧪 Test
        run: task test

      - name: 🪣 S3 Lifecycle
        run: task test:s3

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [validate_version]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 🏗️ Build
        run: task build

  examples:
    name: 📦 Examples
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install

      - name: 📦 Run Examples
        run: task examples
        env:
          QUARRY_NO_SANDBOX: "1"

  package:
    name: 📦 Package (Dry Run)
    runs-on: ubuntu-latest
    needs: [version_lockstep, lint, test, build, examples]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build SDK
        working-directory: sdk
        run: pnpm run build

      - name: 📦 Package
        env:
          VERSION: ${{ inputs.version }}
        run: scripts/ci/package-source.sh "$VERSION"

      - name: 📋 Package Summary
        run: scripts/ci/package-summary.sh

      - name: ⬆️ Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-dist
          path: dist/
          retention-days: 7

  container:
    name: 🐳 Container Images (Dry Run)
    runs-on: ubuntu-latest
    needs: [version_lockstep, lint, test, build, examples]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🏷️ Extract commit
        id: meta
        run: scripts/ci/image-metadata.sh

      - name: 🐳 Build slim (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          push: false
          platforms: linux/amd64,linux/arm64
          build-args: COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build full (no push, amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          push: false
          platforms: linux/amd64
          build-args: COMMIT=${{ steps.meta.outputs.commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
