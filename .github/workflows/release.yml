name: 📦 Release

on:
  push:
    tags: [v*]

permissions:
  contents: write
  packages: write

# One run per tag, so no two write the same release.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag_check:
    name: 🔎 Tag Check
    runs-on: ubuntu-latest
    outputs:
      semver_match: ${{ steps.regex-match.outputs.match }}
    steps:
      - name: 🔎 Match SemVer Tag
        uses: actions-ecosystem/action-regex-match@v2
        id: regex-match
        with:
          text: ${{ github.ref_name }}
          regex: ^v[0-9]+\.[0-9]+\.[0-9]+$

      - name: 📥 Checkout
        if: ${{ steps.regex-match.outputs.match != '' }}
        uses: actions/checkout@v4

      # The release tool runs on the pinned Node, which strips TypeScript
      # types natively; it needs no install.
      - name: 🧰 Setup Node
        if: ${{ steps.regex-match.outputs.match != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      # Non-release v* tags (e.g. v1.2.3-rc.1) are no-ops for the whole
      # workflow, so they are not subject to the monotonic gate either.
      - name: 🔎 Releases Are Monotonic
        if: ${{ steps.regex-match.outputs.match != '' }}
        run: node scripts/release/src/cli.ts assert-highest-tag "$GITHUB_REF_NAME"

      - name: 🔎 Tag Holds Release Notes
        if: ${{ steps.regex-match.outputs.match != '' }}
        run: node scripts/release/src/cli.ts assert-release-notes "$GITHUB_REF_NAME"

  version_lockstep:
    name: 🔒 Version Lockstep
    runs-on: ubuntu-latest
    needs: [tag_check]
    if: ${{ needs.tag_check.outputs.semver_match != '' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔒 Check All Versions Match Tag
        run: scripts/version-check.sh "$GITHUB_REF_NAME"

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    needs: [tag_check]
    if: ${{ needs.tag_check.outputs.semver_match != '' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧹 Lint
        run: task lint

  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: [tag_check]
    if: ${{ needs.tag_check.outputs.semver_match != '' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🧪 Test
        run: task test

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    needs: [tag_check]
    if: ${{ needs.tag_check.outputs.semver_match != '' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build
        run: task build

  examples:
    name: 📦 Examples
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Run Examples
        run: task examples
        env:
          QUARRY_NO_SANDBOX: "1"

  cross-compile:
    name: 🔨 Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [version_lockstep, lint, test, build, examples]
    if: ${{ needs.version_lockstep.result == 'success' }}
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Bundle executor
        run: task executor:bundle

      - name: 📦 Build & Archive
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: scripts/ci/package-binary.sh "$GITHUB_REF_NAME"

      - name: ⬆️ Upload
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  package:
    name: 📦 Package
    runs-on: ubuntu-latest
    needs: [cross-compile]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build SDK
        working-directory: sdk
        run: pnpm run build

      - name: 📦 Package source & SDK
        run: scripts/ci/package-source.sh "$GITHUB_REF_NAME"

      - name: ⬇️ Download platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist/
          merge-multiple: true

      - name: 📋 Generate checksums manifest
        run: scripts/ci/checksums-manifest.sh

      - name: ⬆️ Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/

  hold:
    name: ⏸️ Release Approval
    runs-on: ubuntu-latest
    needs: [package]
    environment:
      name: release
    steps:
      - name: ✅ Await Approval
        run: 'true'

  release:
    name: 📝 Draft Release
    runs-on: ubuntu-latest
    needs: [hold]
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: ⬇️ Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      # The release stays a draft until everything has published, so a
      # failed upload is never public.
      - name: 📝 Draft Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/src/cli.ts draft-release "$GITHUB_REF_NAME"

      - name: 📎 Upload and Verify Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/src/cli.ts upload-assets "$GITHUB_REF_NAME" dist

  publish_ghpr:
    name: 📦 Publish SDK (GitHub Packages)
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          registry-url: https://npm.pkg.github.com
          scope: "@pithecene"

      - name: 📦 Setup pnpm via Corepack
        run: scripts/ci/setup-pnpm.sh

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build SDK
        working-directory: sdk
        run: pnpm run build

      - name: 🔍 Publish Diagnostics
        run: scripts/ci/publish-diagnostics.sh sdk

      - name: 📦 Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/src/cli.ts publish-npm sdk

  publish_jsr:
    name: 📦 Publish SDK (JSR)
    runs-on: ubuntu-latest
    needs: [release]
    # Sized for publish-jsr's three 8-minute attempts plus backoff.
    timeout-minutes: 35
    permissions:
      contents: read
      id-token: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup
        uses: ./.github/actions/setup

      - name: 📦 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📦 Publish
        run: node scripts/release/src/cli.ts publish-jsr sdk "${GITHUB_REF_NAME#v}"

  container:
    name: 🐳 Container Images
    runs-on: ubuntu-latest
    needs: [release]
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        run: scripts/ci/image-metadata.sh "$GITHUB_REF_NAME"

      - name: 🐳 Build & push (slim)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: slim
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: COMMIT=${{ steps.meta.outputs.commit }}
          tags: |
            ghcr.io/pithecene/quarry:${{ steps.meta.outputs.version }}-slim
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 🐳 Build & push (full, amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: full
          push: true
          platforms: linux/amd64
          build-args: COMMIT=${{ steps.meta.outputs.commit }}
          tags: |
            ghcr.io/pithecene/quarry:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  publish_release:
    name: 🚀 GitHub Release
    runs-on: ubuntu-latest
    needs: [release, publish_ghpr, publish_jsr, container, pointers]
    # A newer release's pointer job can replace this one in its queue, which
    # cancels it harmlessly, so only its failure withholds this release.
    if: >-
      ${{ !cancelled() && needs.release.result == 'success'
      && needs.publish_ghpr.result == 'success' && needs.publish_jsr.result == 'success'
      && needs.container.result == 'success' && needs.pointers.result != 'failure' }}
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0

      - name: ⬇️ Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      # The packages took a while, and the tag may have moved meanwhile.
      - name: 🔎 Tag Names This Commit
        run: node scripts/release/src/cli.ts assert-release-notes "$GITHUB_REF_NAME"

      - name: 📎 Verify Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/src/cli.ts upload-assets "$GITHUB_REF_NAME" dist

      - name: 🚀 Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release/src/cli.ts publish-release "$GITHUB_REF_NAME"

  # Publishing jobs publish versioned artifacts only. This job owns the moving
  # pointers (npm `latest`, GHCR :latest/:slim) and points them at the highest
  # published release. Registries offer no compare-and-swap on these
  # pointers, so the job is serialized across release runs; a pending run
  # dropped by the concurrency group is harmless because the run that
  # replaces it converges to the newer registry state.
  pointers:
    name: 🏷️ Release Pointers
    runs-on: ubuntu-latest
    needs: [publish_ghpr, container]
    # Run if either registry published, so one registry's failure does not
    # leave the other's pointers stale (the script converges each one only
    # to releases actually published there).
    if: ${{ !cancelled() && (needs.publish_ghpr.result == 'success' || needs.container.result == 'success') }}
    concurrency:
      group: release-pointers
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🧰 Setup Node for GitHub Packages
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          registry-url: https://npm.pkg.github.com
          scope: "@pithecene"

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Converge release pointers
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/release/src/cli.ts converge-pointers sdk ghcr.io/pithecene/quarry
