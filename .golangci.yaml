version: "2"

run:
  go: "1.27"
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - whitespace

    # correctness
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - bodyclose
    - contextcheck

    # API / library hygiene
    - errorlint
    - nilerr
    - nilnil
    - unconvert
    - unparam
    - revive

    # maintainability
    - gocyclo
    - gocritic
    - misspell

  settings:
    gocyclo:
      min-complexity: 12

    revive:
      severity: error
      rules:
        - name: exported
        - name: package-comments
        - name: error-strings
        - name: error-return

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    gofumpt:
      extra-rules: true
    goimports:
      local-prefixes:
        - github.com/pithecene/quarry

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
