version: "2"

# Bosun's Go analyzers, which the internal check runs on this module
# (bosun.yaml, task check, and CI's check job). The stock linters stay in
# .golangci.yaml, which CI's lint job runs.
linters:
  default: none
  enable:
    - testparallel
    - useany
    - errjoin
    - responseclose
    - testtable
  settings:
    custom:
      testparallel:
        type: module
        settings:
          serial-helper-packages:
            - github.com/pithecene/quarry/internal/testutil
      useany:
        type: module
      errjoin:
        type: module
      testtable:
        type: module
        settings:
          serial-helper-packages:
            - github.com/pithecene/quarry/internal/testutil
      responseclose:
        type: module
        settings:
          close-helper-packages:
            - github.com/pithecene/quarry/iox

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
