<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
@font-face { font-family: "Inter"; src: url("fonts/Inter.ttf"); font-weight: 100 900; }
@font-face { font-family: "Garamond"; src: url("fonts/EBGaramond.ttf"); font-weight: 400 800; }
html, body { margin: 0; background: transparent; }
svg { display: block; }
</style></head>
<body><div id="root"></div>
<script>
const dark = location.hash === "#dark";
const W = 1280, H = 480, R = 28;
const P = dark
  ? { img: "plate-dark.png", veil: "#0b1020", text: "#f3ecdd", sub: "#bdb4a3", accent: "#e8b85a", cap: "#9d968a", rule: "#e9ddc2" }
  : { img: "plate-light.png", veil: "#f4ecda", text: "#211a12", sub: "#5c5143", accent: "#a86c0e", cap: "#7a6d5b", rule: "#2a2219" };
const svg = `<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
<defs>
  <clipPath id="card"><rect width="${W}" height="${H}" rx="${R}"/></clipPath>
  <linearGradient id="veil" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="${P.veil}" stop-opacity="0.97"/>
    <stop offset="0.36" stop-color="${P.veil}" stop-opacity="0.9"/>
    <stop offset="0.58" stop-color="${P.veil}" stop-opacity="0"/>
  </linearGradient>
</defs>
<g clip-path="url(#card)">
  <image href="${P.img}" x="0" y="${(H - W / 2.516) / 2}" width="${W}" height="${W / 2.516}" preserveAspectRatio="xMidYMid slice"/>
  <rect width="${W}" height="${H}" fill="url(#veil)"/>
  <text x="72" y="150" font-family="Garamond" font-weight="500" font-size="15" letter-spacing="4.2" fill="${P.accent}">PITHECENE · EXTRACTION RUNTIME</text>
  <text x="64" y="262" font-family="Grotesk" font-weight="700" font-size="124" letter-spacing="-4.5" fill="${P.text}">quarry</text>
  <text x="70" y="318" font-family="Inter" font-weight="500" font-size="27" letter-spacing="-0.3" fill="${P.sub}">Browser-driven extraction,</text>
  <text x="70" y="354" font-family="Inter" font-weight="500" font-size="27" letter-spacing="-0.3" fill="${P.sub}">durably ingested.</text>
  <rect x="0.5" y="0.5" width="${W - 1}" height="${H - 1}" rx="${R}" fill="none" stroke="${P.rule}" stroke-opacity="0.25"/>
</g>
</svg>`;
document.getElementById("root").innerHTML = svg;
</script></body></html>
