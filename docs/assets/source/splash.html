<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Grotesk"; src: url("fonts/SpaceGrotesk.ttf"); font-weight: 300 700; }
@font-face { font-family: "Inter"; src: url("fonts/Inter.ttf"); font-weight: 100 900; }
html, body { margin: 0; background: transparent; }
svg { display: block; }
</style></head>
<body><div id="root"></div>
<script>
// README banner: the mark (a terraced block with one block lifted out), the
// wordmark and the tagline. Light and dark variants.
const dark = location.hash === "#dark";
const W = 1280, H = 360, R = 28;

const PAL = dark ? {
  bg0: "#0e1013", bg1: "#1b1812", glow: "#f0a23a", glowOp: 0.22, grid: "#ffffff", gridOp: 0.05,
  text: "#f5f1ea", sub: "#a8a196", accent: "#f2b24c",
  faces: { top: "#e9d9b8", right: "#b59b72", left: "#7c6a4f" }, lift: { top: "#ffd27a", right: "#f2a93b", left: "#c47f1e" },
} : {
  bg0: "#fbf8f2", bg1: "#f0e8da", glow: "#f2b24c", glowOp: 0.25, grid: "#1b1a17", gridOp: 0.06,
  text: "#1b1a17", sub: "#5f584d", accent: "#c27512",
  faces: { top: "#d9c9a6", right: "#a88e66", left: "#6f5e45" }, lift: { top: "#ffc85e", right: "#e8992a", left: "#b56f12" },
};

// --- isometric voxels ---------------------------------------------------------------
const U = 34, OX = 170, OY = 196;            // unit size and origin of the mark
const C30 = Math.cos(Math.PI / 6);
const iso = (x, y, z) => [OX + (x - y) * C30 * U, OY + (x + y) * 0.5 * U - z * U];
const face = (pts, fill) => `<path d="M${pts.map(p => iso(...p).map(v => v.toFixed(1)).join(" ")).join(" L")} Z" fill="${fill}" stroke="${fill}" stroke-width="0.6" stroke-linejoin="round"/>`;
function cube(x, y, z, c) {
  return face([[x, y, z + 1], [x + 1, y, z + 1], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]], c.top) +
    face([[x + 1, y, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x + 1, y, z + 1]], c.right) +
    face([[x, y + 1, z], [x + 1, y + 1, z], [x + 1, y + 1, z + 1], [x, y + 1, z + 1]], c.left);
}
// terraces stepping down toward the viewer: the quarry
const HEIGHT = [[3, 3, 3], [3, 2, 2], [2, 2, 1]];
function mark() {
  const cubes = [];
  HEIGHT.forEach((row, y) => row.forEach((h, x) => { for (let z = 0; z < h; z++) cubes.push([x, y, z, PAL.faces]); }));
  cubes.push([4.4, 0.4, 3.6, PAL.lift]);     // the block lifted out, clear of the face
  cubes.sort((a, b) => (a[0] + a[1] + a[2]) - (b[0] + b[1] + b[2]));
  return cubes.map(([x, y, z, c]) => cube(x, y, z, c)).join("");
}

// faint isometric grid that fades toward the right edge
function grid() {
  let s = "";
  for (let k = -40; k < 60; k++) {
    const x0 = k * 40;
    s += `<path d="M${x0} 0 L${x0 + H / Math.tan(Math.PI / 6)} ${H}" /><path d="M${x0} ${H} L${x0 + H / Math.tan(Math.PI / 6)} 0" />`;
  }
  return `<g stroke="${PAL.grid}" stroke-opacity="${PAL.gridOp}" stroke-width="1" mask="url(#fade)">${s}</g>`;
}

const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${PAL.bg0}"/><stop offset="1" stop-color="${PAL.bg1}"/></linearGradient>
  <radialGradient id="glow" cx="170" cy="190" r="260" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="${PAL.glow}" stop-opacity="${PAL.glowOp}"/><stop offset="1" stop-color="${PAL.glow}" stop-opacity="0"/></radialGradient>
  <linearGradient id="fadeG" x1="0" y1="0" x2="1" y2="0"><stop offset="0.35" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></linearGradient>
  <mask id="fade"><rect width="${W}" height="${H}" fill="url(#fadeG)"/></mask>
  <clipPath id="card"><rect width="${W}" height="${H}" rx="${R}"/></clipPath>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="${dark ? 0.45 : 0.18}"/></filter>
</defs>
<g clip-path="url(#card)">
  <rect width="${W}" height="${H}" fill="url(#bg)"/>
  ${grid()}
  <rect width="${W}" height="${H}" fill="url(#glow)"/>
  <g filter="url(#shadow)">${mark()}</g>
  <text x="372" y="186" font-family="Grotesk" font-weight="700" font-size="124" letter-spacing="-4" fill="${PAL.text}">quarry</text>
  <text x="378" y="246" font-family="Inter" font-weight="500" font-size="30" letter-spacing="-0.4" fill="${PAL.sub}">Browser-driven <tspan fill="${PAL.accent}" font-weight="650">extraction</tspan>, durably <tspan fill="${PAL.accent}" font-weight="650">ingested</tspan>.</text>
</g>
</svg>`;
document.getElementById("root").innerHTML = svg;
</script></body></html>
